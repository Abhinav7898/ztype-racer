<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08152e"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Jet Engine Thruster Core -->
  <path d="M29 44 L32 53 L35 44 Z" fill="#00f0ff" opacity="0.9" filter="url(#glow)"/>
  <path d="M30 44 L32 49 L34 44 Z" fill="#ffffff"/>

  <!-- Fighter Spaceship Chevron -->
  <path d="M32 12 L46 44 L32 38 L18 44 Z" fill="#050d1a" stroke="#00f0ff" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M32 16 L42 41 L32 36 L22 41 Z" fill="#00f0ff" fill-opacity="0.15"/>
  <polygon points="32,20 35,32 32,30 29,32" fill="#00f0ff"/>
</svg>
